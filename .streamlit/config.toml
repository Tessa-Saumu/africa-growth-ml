# Africa Growth Explorer - Streamlit settings
# M10: enableCORS removed (triggers a security warning at boot); no hardcoded
# port (Cloud manages its own). Theme values mirror src/visualization.py.

[theme]
primaryColor = "#1B4F72"
backgroundColor = "#F8F9FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2C3E50"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
